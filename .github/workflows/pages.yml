name: Publicar frontend en GitHub Pages

# Se dispara cada vez que hay push a la rama dev (o manual, desde la
# pestaña Actions con "Run workflow"). Solo empaqueta la carpeta
# frontend/ tal cual está — no mueve ni renombra nada del repo.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar SOLO la carpeta frontend/
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
